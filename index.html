<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua Guess</title>
    <meta name="author" content="Hafsa Shahid">
    <meta name="copyright" content="© 2025 Hafsa Shahid. All rights reserved.">


    <!-- custom css -->
    <link rel="stylesheet" href="./style.css">

    <!-- Disable source view by right click -->
<script>
    document.addEventListener('contextmenu', event => event.preventDefault());
  </script>
  <style>
    ::selection { background: #fff; color: #000; }
    body::after {
      content: "© 2025 Hafsa Shahid";
      position: fixed;
      bottom: 5px;
      right: 10px;
      font-size: 10px;
      opacity: 0.6;
    }
  </style>
  
</head>
<body>
    
        <div class="aqua-guess">
            <h1>Aqua Guess</h1>
                <div id="levelSelect">
                    <p>Choose your difficulty level:</p>
                    <button class="btn easy" onclick="startGame('easy')">Easy (1 - 10)</button>
                    <button class="btn medium" onclick="startGame('medium')">Medium (1 - 50)</button>
                    <button class="btn hard" onclick="startGame('hard')">Hard (1 - 100)</button>
                </div>

                <div id="gameSection" style="display: none;">
                    <p id="rangeInfo"></p>
                    <input type="number" id="userGuess" placeholder="Enter your guess">
                    <button class="action-btn" onclick="checkGuess()">Guess</button>
                    <button class="action-btn" onclick="resetGame()">Reset</button>
                    <p id="message" class="info"></p>
                    <p id="attempts"></p>
                </div>
        </div>
        
    <script src="./index.js"></script>
</body>
</html>
